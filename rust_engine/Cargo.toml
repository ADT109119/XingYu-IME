[package]
name = "xingyu_engine"
version = "0.1.0"
edition = "2021"
authors = ["XingYu IME Authors"]
description = "行魚輸入法核心演算法引擎 (XingYu IME Core Engine) - 智慧中英混打、自適應學習與自訂辭典"

[lib]
name = "xingyu_engine"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
